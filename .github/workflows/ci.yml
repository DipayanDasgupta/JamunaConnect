name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jamuna
          POSTGRES_USER: jamuna
          POSTGRES_PASSWORD: jamuna
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jamuna"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit + integration tests
        run: mvn -B verify
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/jamuna
          DATABASE_USERNAME: jamuna
          DATABASE_PASSWORD: jamuna
      - name: Build jar
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: jamunaconnect-jar
          path: target/jamunaconnect-*.jar

  # Presentation layer auto-deploys to Vercel from main.
  deploy-frontend:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy to Vercel
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Backend auto-deploys to the AWS instance from main.
  deploy-backend:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jamunaconnect-jar
          path: dist
      - name: Upload jar and restart service
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key
          scp -i /tmp/ec2_key -o StrictHostKeyChecking=no dist/jamunaconnect-*.jar "ubuntu@${HOST}:/tmp/app.jar"
          ssh -i /tmp/ec2_key -o StrictHostKeyChecking=no "ubuntu@${HOST}" \
            'sudo mv /tmp/app.jar /opt/jamuna/app.jar && \
             sudo chown jamuna:jamuna /opt/jamuna/app.jar && \
             sudo systemctl restart jamuna && sleep 3 && systemctl is-active jamuna'