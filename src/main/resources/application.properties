spring.application.name=JamunaConnect

# --- Datasource: override through environment in staging/production ---
DATABASE_URL ?= jdbc:postgresql://localhost:5432/jamunaconnect
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:jamuna}
spring.datasource.password=${DATABASE_PASSWORD:jamuna}

# Schema is owned by Flyway, never by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}

server.port=${PORT:8080}
server.error.whitelabel.enabled=false

# Actuator health endpoint watched by the free uptime probe. Mail is
# notification-only and never a hard dependency, so it must not flip health DOWN.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# --- Notification (mail is notification-only; absence is not a hard failure) ---
app.office-email=${OFFICE_EMAIL:jamuna-office@example.iitm.ac.in}
app.escalation-email=${ESCALATION_EMAIL:jamunagensec@example.iitm.ac.in}
app.notify.after-hours=${ESCALATE_AFTER_HOURS:72}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# Escalation scan runs daily at 06:00 server time.
app.escalation.cron=${ESCALATION_CRON:0 0 6 * * *}

# pg_trgm fuzzy search is Postgres-only; H2 local runs use plain substring match.
app.search.fuzzy=${FUZZY_SEARCH:true}

# Per-IP complaint submissions allowed per minute (spam deterrent).
app.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:5}