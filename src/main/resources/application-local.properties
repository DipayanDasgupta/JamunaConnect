# Local profile: fast start on in-memory H2, no external services required.
spring.datasource.url=jdbc:h2:mem:jamuna;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# No SMTP configured -> notification service falls back to the in-app queue.
spring.mail.host=
app.search.fuzzy=false