<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Staff dashboard &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container-fluid py-4 px-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h1 class="h3 mb-0">Complaint triage</h1>
        <div>
            <span class="text-muted me-2" sec:authentication="name">staff</span>
            <a class="btn btn-sm btn-outline-secondary" href="/staff/logout">Sign out</a>
        </div>
    </div>

    <form class="row g-2 my-3" method="get" action="/staff/dashboard">
        <div class="col-auto">
            <select class="form-select" name="status" onchange="this.form.submit()">
                <option value="">All statuses</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                        th:selected="${s == selectedStatus}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-primary" type="submit">Apply filter</button>
        </div>
    </form>

    <div id="alert" class="alert d-none" role="alert"></div>

    <div class="table-responsive">
        <table class="table table-hover align-middle" id="complaints-table">
            <thead>
            <tr><th>#</th><th>Room</th><th>Category</th><th>Summary</th><th>Status</th>
                <th>Filed</th><th>Move to</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${complaints}" th:attr="data-id=${c.id}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.roomNumber}"></td>
                <td th:text="${c.category}"></td>
                <td class="text-truncate" style="max-width: 24rem;" th:text="${c.description}"></td>
                <td><span class="badge text-bg-secondary status-badge" th:text="${c.status}"></span></td>
                <td th:text="${#temporals.format(c.createdAt, 'dd MMM HH:mm')}"></td>
                <td>
                    <select class="form-select form-select-sm transition-target">
                        <option th:each="s : ${statuses}" th:value="${s}"
                                th:text="${s}"></option>
                    </select>
                </td>
                <td>
                    <button class="btn btn-sm btn-primary apply-transition">Apply</button>
                    <button class="btn btn-sm btn-outline-secondary view-timeline">Timeline</button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(complaints)}">
                <td colspan="8" class="text-center text-muted py-4">No complaints match this filter.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script th:inline="javascript">
    window.__complaints = /*[[${complaints}]]*/ [];
</script>
<script src="/js/dashboard.js"></script>
</body>
</html>
