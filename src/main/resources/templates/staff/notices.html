<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Manage notices &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/staff-assets/css/app.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-4" style="max-width: 1080px;">
    <div th:replace="~{fragments/layout :: staffNav}"></div>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <h1 class="h3 mb-0">Notice board</h1>
            <p class="text-muted mb-0 small">Post announcements; residents see them immediately.</p>
        </div>
        <a class="btn btn-sm btn-outline-secondary" href="/notices" target="_blank" rel="noopener">View public page</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5">Add a notice</h2>
            <form th:action="@{/staff/notices}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-8">
                    <label class="form-label" for="title">Title</label>
                    <input class="form-control" id="title" name="title" maxlength="160" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="eventDate">Event date</label>
                    <input class="form-control" id="eventDate" name="eventDate" type="date" required/>
                </div>
                <div class="col-12">
                    <label class="form-label" for="description">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4"
                              maxlength="4000" required></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="linkUrl">Link (optional)</label>
                    <input class="form-control" id="linkUrl" name="linkUrl" type="url"
                           placeholder="https://forms.gle/..."/>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="imageUrl">Image URL (optional)</label>
                    <input class="form-control" id="imageUrl" name="imageUrl" type="url"
                           placeholder="https://..."/>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Post notice</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th>Date</th><th>Title</th><th>Description</th><th>Link</th><th>Posted by</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="n : ${notices}">
                    <td class="text-nowrap" th:text="${#temporals.format(n.eventDate, 'dd MMM yyyy')}"></td>
                    <td class="fw-semibold" th:text="${n.title}"></td>
                    <td class="text-muted small text-truncate" style="max-width: 22rem;"
                        th:text="${n.description}" th:title="${n.description}"></td>
                    <td>
                        <a th:if="${n.linkUrl}" th:href="${n.linkUrl}" target="_blank" rel="noopener">Open</a>
                        <span th:unless="${n.linkUrl}" class="text-muted">-</span>
                    </td>
                    <td th:text="${n.postedBy}"></td>
                    <td class="text-end">
                        <form th:action="@{/staff/notices/{id}/delete(id=${n.id})}" method="post"
                              onsubmit="return confirm('Remove this notice?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-danger" type="submit">Remove</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(notices)}">
                    <td colspan="6" class="text-center text-muted py-4">No notices yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
