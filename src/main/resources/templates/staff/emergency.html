<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Manage emergency info &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/staff-assets/css/app.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-4" style="max-width: 1080px;">
    <div th:replace="~{fragments/layout :: staffNav}"></div>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
            <h1 class="h3 mb-0">Emergency information</h1>
            <p class="text-muted mb-0 small">First-aid card and the numbers residents should call.</p>
        </div>
        <a class="btn btn-sm btn-outline-secondary" href="/emergency" target="_blank" rel="noopener">View public page</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5">First-aid card</h2>
            <form th:action="@{/staff/emergency/first-aid}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label" for="contents">Contents</label>
                    <textarea class="form-control" id="contents" name="contents" rows="4"
                              maxlength="4000" th:text="${firstAid != null ? firstAid.contents : ''}"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="guidelines">Usage guidelines</label>
                    <textarea class="form-control" id="guidelines" name="guidelines" rows="4"
                              maxlength="4000" th:text="${firstAid != null ? firstAid.guidelines : ''}"></textarea>
                </div>
                <button class="btn btn-primary" type="submit">Save card</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="h5">Emergency contacts</h2>
            <div class="table-responsive mb-3">
                <table class="table align-middle mb-0">
                    <thead class="table-light"><tr><th>Role</th><th>Phone</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${contacts}">
                        <td class="fw-semibold" th:text="${c.roleTitle}"></td>
                        <td th:text="${c.phone}"></td>
                        <td class="text-end">
                            <form th:action="@{/staff/emergency/contacts/{id}/delete(id=${c.id})}" method="post"
                                  onsubmit="return confirm('Remove this contact?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-sm btn-outline-danger" type="submit">Remove</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(contacts)}">
                        <td colspan="3" class="text-center text-muted py-3">No contacts yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <form th:action="@{/staff/emergency/contacts}" method="post" class="row g-2 align-items-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-5">
                    <label class="form-label" for="roleTitle">Role</label>
                    <input class="form-control" id="roleTitle" name="roleTitle" maxlength="128"
                           placeholder="Security Desk" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="phone">Phone</label>
                    <input class="form-control" id="phone" name="phone" maxlength="64" required/>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" type="submit">Add contact</button>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
