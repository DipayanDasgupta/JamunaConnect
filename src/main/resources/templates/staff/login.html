<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Staff sign in &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width: 420px;">
    <h1 class="mb-4 text-center">Staff sign in</h1>
    <form th:action="@{/staff/login}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" required autofocus/>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required/>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
        <div th:if="${param.error}" class="text-danger small mt-3">Invalid username or password.</div>
        <div th:if="${param.logout}" class="text-success small mt-3">Signed out.</div>
    </form>
    <p class="text-center text-muted small mt-3">
        Roles: office staff (triage) and Warden (read-only oversight).
    </p>
</main>
</body>
</html>
