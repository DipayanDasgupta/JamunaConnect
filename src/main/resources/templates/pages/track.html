<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Track a complaint &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/staff-assets/css/app.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-5" style="max-width: 760px;">
    <h1 class="mb-2">Track a complaint</h1>
    <p class="text-muted">Enter the complaint number and the random tracking code shown when you filed it.</p>

    <form id="track-form" class="card p-4 shadow-sm mb-4">
        <div class="row g-2 align-items-end">
            <div class="col-sm-4">
                <label class="form-label" for="complaintId">Complaint #</label>
                <input class="form-control" id="complaintId" inputmode="numeric" placeholder="12" required/>
            </div>
            <div class="col-sm-5">
                <label class="form-label" for="trackingToken">Tracking code</label>
                <input class="form-control" id="trackingToken" name="trackingToken"
                       autocomplete="off" placeholder="e.g. 8fK2mQ7xLp4A" required/>
            </div>
            <div class="col-sm-3">
                <button class="btn btn-primary w-100" type="submit">Track</button>
            </div>
        </div>
    </form>

    <div id="track-result"></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="/staff-assets/js/track.js"></script>
</body>
</html>
