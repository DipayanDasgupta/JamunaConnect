<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Notice board &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/staff-assets/css/app.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-5">
    <div class="mb-4">
        <h1 class="mb-2">Notice board</h1>
        <p class="text-muted mb-0">Announcements and upcoming events posted by the hostel office.</p>
    </div>
    <div id="notices-list" class="row g-3"></div>
    <p id="notices-empty" class="text-muted d-none">No notices posted yet.</p>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="/staff-assets/js/notices.js"></script>
</body>
</html>
