<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Room Lookup &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-5">
    <h1 class="mb-3">Room &amp; resident lookup</h1>
    <p class="text-muted">Live search as you type — room numbers, names, even roll numbers. Misspell it if you like.</p>
    <form class="row g-2" id="lookup-form">
        <div class="col-sm-8">
            <input class="form-control form-control-lg" id="query" name="query"
                   placeholder="e.g. A101, or a half-remembered name" autocomplete="off"/>
        </div>
        <div class="col-sm-4">
            <button class="btn btn-primary btn-lg w-100" type="submit">Search</button>
        </div>
    </form>
    <div id="results" class="mt-4"></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="/js/lookup.js"></script>
</body>
</html>
