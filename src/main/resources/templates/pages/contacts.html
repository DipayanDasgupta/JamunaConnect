<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Contacts &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/staff-assets/css/app.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-5">
    <h1 class="mb-4">Hostel contacts</h1>
    <p class="text-muted">Sourced live from the editable directory: an office-bearer change is a
        one-row update, not a code change.</p>
    <table class="table table-striped align-middle" id="contacts-table">
        <thead><tr><th>Role</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>
        <tbody>
        <tr th:each="c : ${contacts}">
            <td th:text="${c.role}"></td>
            <td th:text="${c.name}"></td>
            <td>
                <a th:if="${c.phone}" th:href="${'tel:' + c.phone}" th:text="${c.phone}"></a>
                <span th:unless="${c.phone}" class="text-muted">&mdash;</span>
            </td>
            <td>
                <a th:if="${c.email}" th:href="${'mailto:' + c.email}" th:text="${c.email}"></a>
                <span th:unless="${c.email}" class="text-muted">&mdash;</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(contacts)}">
            <td colspan="4" class="text-muted text-center">No contacts yet.</td>
        </tr>
        </tbody>
    </table>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="/staff-assets/js/contacts.js"></script>
</body>
</html>
