<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Contacts &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-5">
    <h1 class="mb-4">Hostel contacts</h1>
    <p class="text-muted">Sourced live from the editable directory: an office-bearer change is a
        one-row update, not a code change.</p>
    <table class="table table-striped align-middle" id="contacts-table">
        <thead><tr><th>Role</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>
        <tbody></tbody>
    </table>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="/js/contacts.js"></script>
</body>
</html>
