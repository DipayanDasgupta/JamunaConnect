<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Emergency &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/staff-assets/css/app.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-5">
    <div class="mb-4">
        <h1 class="mb-2">Emergency information</h1>
        <p class="text-muted mb-0">First-aid kit contents, basic guidance and who to call.</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h5">First-aid kit</h2>
                    <p class="text-muted small mb-3">Contents are maintained by the hostel office.</p>
                    <h3 class="h6 text-uppercase text-muted">Contents</h3>
                    <p id="first-aid-contents" class="mb-3">Loading&hellip;</p>
                    <h3 class="h6 text-uppercase text-muted">Usage guidelines</h3>
                    <p id="first-aid-guidelines" class="mb-0">Loading&hellip;</p>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h5">Emergency contacts</h2>
                    <p class="text-muted small">Call the Security Desk first for any incident inside the hostel.</p>
                    <div id="emergency-contacts" class="list-group list-group-flush">
                        <p class="text-muted">Loading&hellip;</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="/staff-assets/js/emergency.js"></script>
</body>
</html>
