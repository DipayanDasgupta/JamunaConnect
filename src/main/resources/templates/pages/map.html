<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Campus Map &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-4">
    <h1 class="mb-3">Jamuna campus map</h1>
    <p class="text-muted">Click a block; the popup calls the same <code>/api/rooms</code>
        endpoint as the search box, so both share one source of truth.</p>
    <div id="map" style="height: 560px; border-radius: .5rem;"></div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/map.js"></script>
</body>
</html>
