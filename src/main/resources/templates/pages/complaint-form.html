<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>File a Complaint &middot; JamunaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container py-5" style="max-width: 720px;">
    <h1 class="mb-3">File a complaint or query</h1>
    <div id="alert" class="alert d-none" role="alert"></div>
    <form id="complaint-form" novalidate>
        <div class="mb-3">
            <label class="form-label" for="submitterName">Your name</label>
            <input class="form-control" id="submitterName" name="submitterName" maxlength="128" required/>
        </div>
        <div class="mb-3">
            <label class="form-label" for="roomNumber">Room number</label>
            <input class="form-control" id="roomNumber" name="roomNumber" placeholder="A101" required/>
        </div>
        <div class="mb-3">
            <label class="form-label" for="category">Category</label>
            <select class="form-select" id="category" name="category" required>
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="5"
                      maxlength="2000" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Submit complaint</button>
    </form>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="/js/complaint-form.js"></script>
</body>
</html>
